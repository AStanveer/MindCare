<div th:fragment="navbar(activePage)">

    <style>
        .navbar {
            background: white;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            color:#8C7AE6;
            gap: 8px;
        }

        .logo-icon {
            width: 26px;
            height: auto;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            color: #333;
            text-decoration: none;
            font-size: 14px;
            transition: all .2s;
        }

        .nav-btn.active {
            background: #8c7ae6;
            color: white;
        }

        .nav-btn:hover { 
            background: #D8CFF7;
        }

        .link-icon {
            width: 18px; 
            height: 18px;
            
            display: flex; 
            justify-content: center;
            align-items: center;
        }

        .link-icon svg {
            width: 100%;
            height: 100%;
        }

        @media (max-width: 600px) {
            .nav-content {
                flex-direction: column;
                gap: 10px;
            }

            .nav-buttons {
                justify-content: center;
                row-gap: 10px;
            }

            .nav-btn {
                font-size: 13px;
                padding: 8px 10px;
            }
        }
    </style>

    <div class="navbar">
        <div class="nav-content">

            <div class="logo">
                <span class="logo-icon">
                    <th:block
                        th:replace="~{fragments/icons ::icon-self-care}">
                    </th:block>
                </span>
                <span ; font-size: 16px;>MindCare</span>
            </div>

            <div class="nav-buttons">

                <a class="nav-btn"
                    th:classappend="${activePage == 'dashboard'} ? ' active' : ''"
                    th:href="@{/mindcare/student/dashboard}">
                    <span class="link-icon">
                        <th:block
                            th:replace="~{fragments/icons ::icon-home}">
                        </th:block>
                    </span>
                    <span>Dashboard</span>
                </a>

                <a class="nav-btn"
                   th:classappend="${activePage == 'assessment'} ? ' active' : ''"
                   th:href="@{/mindcare/assessment/dass21}">
                    <span class="link-icon">
                        <th:block
                            th:replace="~{fragments/icons ::icon-assessment}">
                        </th:block>
                    </span>
                    <span>Assessment</span>
                </a>

                <a class="nav-btn"
                    th:classappend="${activePage == 'selfcare'} ? ' active' : ''"
                    th:href="@{/mindcare/selfcare}">
                    <span class="link-icon">
                        <th:block
                            th:replace="~{fragments/icons ::icon-self-care}">
                        </th:block>
                    </span>
                    <span>Self Care</span>
                </a>

                <a class="nav-btn"
                    th:classappend="${activePage == 'resources'} ? ' active' : ''"
                    th:href="@{/mindcare/resources}">
                    <span class="link-icon">
                        <th:block
                            th:replace="~{fragments/icons ::icon-book}">
                        </th:block>
                    </span>

                    <span>Resources</span>
                </a>

                <a class="nav-btn"
                   th:classappend="${activePage == 'peersupport'} ? ' active' : ''"
                   th:href="@{/mindcare/peer-support}">
                    <span class="link-icon">
                        <th:block
                            th:replace="~{fragments/icons ::icon-people}">
                        </th:block>
                    </span>
                    <span>Peer Support</span>
                </a>

                <a class="nav-btn"
                    th:classappend="${activePage == 'counselling'} ? ' active' : ''"
                    th:href="@{/mindcare/counselling/booking}">
                    <span class="link-icon">
                        <th:block
                            th:replace="~{fragments/icons ::icon-book-session}">
                        </th:block>
                    </span>
                    <span>Counselling</span>
                </a>
                
                <a class="nav-btn"
                    th:classappend="${activePage == 'profile'} ? ' active' : ''"
                    th:href="@{/mindcare/profile}">
                    <span class="link-icon">
                        <th:block
                            th:replace="~{fragments/icons ::icon-person}">
                        </th:block>
                    </span>
                    <span>Profile</span>
                </a>
                
                <a class="nav-btn"
                    th:classappend="${activePage == 'logout'} ? ' active' : ''"
                    th:href="@{/mindcare/logout}">
                    <span class="link-icon">
                        <th:block
                            th:replace="~{fragments/icons ::icon-logout}">
                        </th:block>
                    </span>
                    <span>Logout</span>
                </a>

            </div>
        </div>
    </div>
</div>
