<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - MindCare</title>
    <link rel="stylesheet" th:href="@{/css/profile/profile-view.css}">
    <style>
        .password-form {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--mc-border);
            border-radius: 8px;
        }
        
        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        .btn-primary {
            background: var(--mc-purple);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .btn-secondary {
            background: var(--mc-button-gray);
            color: var(--mc-text-dark);
            padding: 10px 20px;
            border: 1px solid var(--mc-border);
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <div th:replace="~{fragments/navbar :: navbar('profile')}"></div>

    <div class="container">
        <div class="header-banner">
            <div class="header-content">
                <h1>Change Password</h1>
                <p>Update your account password</p>
            </div>
            <a th:href="@{/mindcare/profile/view}" class="pill-edit-btn">Back to Profile</a>
        </div>

        <!-- Error Message -->
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

        <div class="profile-card">
            <form th:action="@{/mindcare/profile/change-password}" method="post" class="password-form">
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" name="currentPassword" required>
                </div>
                
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="newPassword" required>
                </div>
                
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" name="confirmPassword" required>
                </div>
                
                <div class="button-row">
                    <a th:href="@{/mindcare/profile/view}" class="btn-secondary">Cancel</a>
                    <button type="submit" class="btn-primary">Change Password</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
