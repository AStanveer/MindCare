<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MindCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-icon">
                <svg width="80" height="80" viewBox="0 0 37 37" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9.99996 32.77V30C9.99996 29.1159 10.3511 28.2681 10.9763 27.643C11.6014 27.0178 12.4492 26.6667 13.3333 26.6667H23.3333C24.2173 26.6667 25.0652 27.0178 25.6903 27.643C26.3154 28.2681 26.6666 29.1159 26.6666 30V32.77M35 18.3333C35 27.5381 27.538 35 18.3333 35C9.12855 35 1.66663 27.5381 1.66663 18.3333C1.66663 9.12858 9.12855 1.66666 18.3333 1.66666C27.538 1.66666 35 9.12858 35 18.3333ZM23.3333 15C23.3333 17.7614 21.0947 20 18.3333 20C15.5719 20 13.3333 17.7614 13.3333 15C13.3333 12.2386 15.5719 9.99999 18.3333 9.99999C21.0947 9.99999 23.3333 12.2386 23.3333 15Z" stroke="#8C7AE6" stroke-width="3.33333" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Sign in to your MindCare account</p>
            </div>

            <div th:if="${success}" class="alert alert-success">
                <span th:text="${success}"></span>
            </div>

            <div th:if="${error}" class="alert alert-error">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/auth/login}" method="post" class="auth-form">
                
                <div class="role-selector-section">
                    <label class="role-label">Sign in as</label>
                    <div class="role-selector">
                        <div class="role-option">
                            <input type="radio" id="student" name="role" value="STUDENT" checked>
                            <label for="student">
                                <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M25.6654 7.33366V14.667M6.66536 10.4337V14.667C6.66536 15.662 7.41979 16.6054 8.77312 17.2963C10.1265 17.9871 12.0118 18.3337 13.9987 18.3337C15.9856 18.3337 17.8709 17.9871 19.2242 17.2963C20.5776 16.6054 21.332 15.662 21.332 14.667V10.4337M24.9454 8.5563C25.1597 8.46172 25.3441 8.30951 25.4777 8.11688C25.6114 7.92424 25.6889 7.69849 25.7018 7.46406C25.7148 7.22962 25.6627 6.99627 25.5517 6.78992C25.4407 6.58357 25.2751 6.41209 25.0734 6.29366L15.3054 1.54699C14.9811 1.38868 14.6243 1.30566 14.262 1.30566C13.8998 1.30566 13.543 1.38868 13.2187 1.54699L3.45203 6.28699C3.25358 6.40805 3.09166 6.58218 2.98399 6.79022C2.87632 6.99827 2.82695 7.23243 2.84082 7.46696C2.85469 7.7015 2.93127 7.92756 3.06257 8.12152C3.19388 8.31549 3.37488 8.46984 3.58536 8.56966L13.2187 13.227C13.543 13.3853 13.8998 13.4684 14.262 13.4684C14.6243 13.4684 14.9811 13.3853 15.3054 13.227L24.9454 8.5563Z" stroke="currentColor" stroke-width="2.33333" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <span>Student</span>
                            </label>
                        </div>
                        <div class="role-option">
                            <input type="radio" id="professional" name="role" value="PROFESSIONAL">
                            <label for="professional">
                                <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M18.6667 25.6667V3.66667C18.6667 2.95942 18.3857 2.28115 17.8856 1.78105C17.3855 1.28095 16.7072 1 16 1H12C11.2928 1 10.6145 1.28095 10.1144 1.78105C9.61429 2.28115 9.33334 2.95942 9.33334 3.66667V25.6667M4 6.33333H24C25.4728 6.33333 26.6667 7.52724 26.6667 9V23C26.6667 24.4728 25.4728 25.6667 24 25.6667H4C2.52724 25.6667 1.33334 24.4728 1.33334 23V9C1.33334 7.52724 2.52724 6.33333 4 6.33333Z" stroke="currentColor" stroke-width="2.33333" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <span>Professional</span>
                            </label>
                        </div>
                        <div class="role-option">
                            <input type="radio" id="admin" name="role" value="ADMIN">
                            <label for="admin">
                                <svg width="24" height="28" viewBox="0 0 24 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M22.3333 15.3337C22.3333 21.6003 17.6667 24.667 12.8 26.4537C12.5295 26.5461 12.2341 26.5409 11.9667 26.4403C7.10001 24.667 2.33334 21.6003 2.33334 15.3337V6.33366C2.33334 5.99214 2.46905 5.66452 2.71076 5.42281C2.95248 5.1811 3.2801 5.04533 3.62168 5.04533C6.16668 5.04533 9.28001 3.56699 11.48 1.62699C11.7424 1.39926 12.0845 1.27466 12.4383 1.27466C12.7922 1.27466 13.1343 1.39926 13.3967 1.62699C15.6067 3.587 18.7133 5.04533 21.2583 5.04533C21.5999 5.04533 21.9275 5.1811 22.1692 5.42281C22.411 5.66452 22.5467 5.99214 22.5467 6.33366L22.3333 15.3337Z" stroke="currentColor" stroke-width="2.33333" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <span>Admin</span>
                            </label>
                        </div>
                    </div>
                    <p class="role-description" id="roleDescription">Access assessments, self-care tools, and support</p>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <div class="input-with-icon">
                        <svg width="22" height="18" viewBox="0 0 22 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 5L9.8906 10.2604C10.5624 10.7083 11.4376 10.7083 12.1094 10.2604L21 5M3 17H19C20.1046 17 21 16.1046 21 15V3C21 1.89543 20.1046 1 19 1H3C1.89543 1 1 1.89543 1 3V15C1 16.1046 1.89543 17 3 17Z" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input type="email" 
                               id="email" 
                               name="email" 
                               placeholder="you@example.com"
                               required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <div class="input-with-icon">
                        <svg width="20" height="22" viewBox="0 0 20 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M15 9V7C15 5.67392 14.4732 4.40215 13.5355 3.46447C12.5979 2.52678 11.3261 2 10 2C8.67392 2 7.40215 2.52678 6.46447 3.46447C5.52678 4.40215 5 5.67392 5 7V9M7 21H13C14.6569 21 16 19.6569 16 18V12C16 10.3431 14.6569 9 13 9H7C5.34315 9 4 10.3431 4 12V18C4 19.6569 5.34315 21 7 21Z" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input type="password" 
                               id="password" 
                               name="password" 
                               placeholder="••••••••"
                               required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <div class="auth-footer">
                <a th:href="@{/auth/register}" style="text-decoration: none;">
                    <p>Don't have an account? Sign up</p>
                </a>
            </div>

            <div class="demo-mode">
                <p><strong>Demo Mode:</strong> Select a role and click Sign In</p>
                <div class="demo-roles">
                    <a href="#" onclick="selectRole('student'); return false;">
                        <svg width="24" height="24" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M25.6654 7.33366V14.667M6.66536 10.4337V14.667C6.66536 15.662 7.41979 16.6054 8.77312 17.2963C10.1265 17.9871 12.0118 18.3337 13.9987 18.3337C15.9856 18.3337 17.8709 17.9871 19.2242 17.2963C20.5776 16.6054 21.332 15.662 21.332 14.667V10.4337M24.9454 8.5563C25.1597 8.46172 25.3441 8.30951 25.4777 8.11688C25.6114 7.92424 25.6889 7.69849 25.7018 7.46406C25.7148 7.22962 25.6627 6.99627 25.5517 6.78992C25.4407 6.58357 25.2751 6.41209 25.0734 6.29366L15.3054 1.54699C14.9811 1.38868 14.6243 1.30566 14.262 1.30566C13.8998 1.30566 13.543 1.38868 13.2187 1.54699L3.45203 6.28699C3.25358 6.40805 3.09166 6.58218 2.98399 6.79022C2.87632 6.99827 2.82695 7.23243 2.84082 7.46696C2.85469 7.7015 2.93127 7.92756 3.06257 8.12152C3.19388 8.31549 3.37488 8.46984 3.58536 8.56966L13.2187 13.227C13.543 13.3853 13.8998 13.4684 14.262 13.4684C14.6243 13.4684 14.9811 13.3853 15.3054 13.227L24.9454 8.5563Z" stroke="#8C7AE6" stroke-width="2.33333" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Student</span>
                    </a>
                    <a href="#" onclick="selectRole('professional'); return false;">
                        <svg width="24" height="24" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18.6667 25.6667V3.66667C18.6667 2.95942 18.3857 2.28115 17.8856 1.78105C17.3855 1.28095 16.7072 1 16 1H12C11.2928 1 10.6145 1.28095 10.1144 1.78105C9.61429 2.28115 9.33334 2.95942 9.33334 3.66667V25.6667M4 6.33333H24C25.4728 6.33333 26.6667 7.52724 26.6667 9V23C26.6667 24.4728 25.4728 25.6667 24 25.6667H4C2.52724 25.6667 1.33334 24.4728 1.33334 23V9C1.33334 7.52724 2.52724 6.33333 4 6.33333Z" stroke="#8C7AE6" stroke-width="2.33333" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Professional</span>
                    </a>
                    <a href="#" onclick="selectRole('admin'); return false;">
                        <svg width="24" height="24" viewBox="0 0 24 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.3333 15.3337C22.3333 21.6003 17.6667 24.667 12.8 26.4537C12.5295 26.5461 12.2341 26.5409 11.9667 26.4403C7.10001 24.667 2.33334 21.6003 2.33334 15.3337V6.33366C2.33334 5.99214 2.46905 5.66452 2.71076 5.42281C2.95248 5.1811 3.2801 5.04533 3.62168 5.04533C6.16668 5.04533 9.28001 3.56699 11.48 1.62699C11.7424 1.39926 12.0845 1.27466 12.4383 1.27466C12.7922 1.27466 13.1343 1.39926 13.3967 1.62699C15.6067 3.587 18.7133 5.04533 21.2583 5.04533C21.5999 5.04533 21.9275 5.1811 22.1692 5.42281C22.411 5.66452 22.5467 5.99214 22.5467 6.33366L22.3333 15.3337Z" stroke="#8C7AE6" stroke-width="2.33333" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Admin</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function selectRole(role) {
            const roles = {
                'student': document.getElementById('student'),
                'professional': document.getElementById('professional'),
                'admin': document.getElementById('admin')
            };
            if (roles[role]) {
                roles[role].checked = true;
                updateRoleDescription(role);
            }
        }
        
        function updateRoleDescription(role) {
            const descriptions = {
                'student': 'Access assessments, self-care tools, and support',
                'professional': 'Manage counselling sessions and create resources',
                'admin': 'Manage users and view platform analytics'
            };
            document.getElementById('roleDescription').textContent = descriptions[role] || descriptions['student'];
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const roleInputs = document.querySelectorAll('input[name="role"]');
            roleInputs.forEach(input => {
                input.addEventListener('change', function() {
                    updateRoleDescription(this.value.toLowerCase());
                });
            });
        });
    </script>
</body>
</html>
