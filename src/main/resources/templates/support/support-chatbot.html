<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Support Chat - MindCare</title>
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/support/support-chatbot.css}">
    </head>
<body>
    <div th:replace="~{fragments/navbar :: navbar('support-chat')}"></div>

    <div class="container">
        
        <header class="forum-header--container">
            <div class="header-content">
                <h2>Peer Support & Chat</h2>
                <p>Connect with others and get instant support</p>
            </div>
        </header>

        <div class="tabs--container">
            <a th:href="@{/mindcare/peer-support}" class="tab-item">
                <svg th:replace="~{fragments/icons ::icon-people}"></svg>
                Peer Forum
            </a>
            <a th:href="@{/mindcare/support-chat}" class="tab-item active">
                <svg th:replace="~{fragments/icons ::icon-bot}"></svg>
                Support Chat
            </a>
        </div>

        <main class="chat--layout">
            
            <div class="card chat--interface">
                <div class="chat--header">
                    <div class="bot-avatar">
                        <svg th:replace="~{fragments/icons ::icon-bot}"></svg>
                    </div>
                    <div class="header-text">
                        <h3>MindCare Support Bot</h3>
                        <p>24/7 emotional support assistant</p>
                    </div>
                </div>

                <div class="chat--messages">
                    <div class="message--item bot">
                        <div class="message--bubble">
                            Hello! I'm here to support you. How are you feeling today?
                        </div>
                    </div>
                </div>

                <div class="chat--input-area">
                    <div class="input-wrapper">
                        <input type="text" placeholder="Type your message..." />
                        <button class="send-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                    <p class="disclaimer-text">This is an AI assistant. For emergencies, please contact your local crisis helpline.</p>
                </div>
            </div>

        </main>
    </div>

    <script>
        const chatMessages = document.querySelector('.chat--messages');
        const inputField = document.querySelector('.input-wrapper input');
        const sendButton = document.querySelector('.send-btn');

        inputField.addEventListener('input', () => {
            if (inputField.value.trim().length > 0) {
                sendButton.classList.add('active');
            } else {
                sendButton.classList.remove('active');
            }
        });


        // 1. Function to add a message to the screen
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message--item', sender);
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.classList.add('message--bubble');
            bubbleDiv.textContent = text;
            
            messageDiv.appendChild(bubbleDiv);
            chatMessages.appendChild(messageDiv);
            
            // Auto-scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 2. Function to show/hide loading indicator
        let loadingDiv = null;
        function toggleLoading(show) {
            if (show) {
                loadingDiv = document.createElement('div');
                loadingDiv.classList.add('message--item', 'bot', 'loading');
                loadingDiv.innerHTML = `<div class="message--bubble"><div class="typing-dots"><span>.</span><span>.</span><span>.</span></div></div>`;
                chatMessages.appendChild(loadingDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } else if (loadingDiv) {
                loadingDiv.remove();
                loadingDiv = null;
            }
        }

        // 3. Main function to handle sending
        async function sendMessage() {
            const message = inputField.value.trim();
            const token = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            const header = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
            
            if (!message) return;

            // A. Show User Message
            addMessage(message, 'user');
            inputField.value = ''; // Clear input
            sendButton.classList.remove('active');
            toggleLoading(true);   // Show bot is thinking

            try {
                // B. Send to Backend
                const response = await fetch('/mindcare/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        [header]: token
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const data = await response.json();

                // C. Show Bot Response
                toggleLoading(false); // Remove loading
                addMessage(data.content, 'bot'); // "content" matches your ChatResponse DTO

            } catch (error) {
                console.error('Error:', error);
                toggleLoading(false);
                addMessage("I'm having trouble connecting right now. Please try again.", 'bot');
            }
        }

        // 4. Event Listeners
        sendButton.addEventListener('click', sendMessage);

        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
