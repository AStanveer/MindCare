<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>
</head>
<body>
    <h1>Something went wrong</h1>
    
    <div th:if="${message}">
        <p>Error details: <span th:text="${message}"></span></p>
    </div>
    
    <a href="/mindcare/dashboard">Go Home</a>
</body>
</html>
